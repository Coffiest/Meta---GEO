name: Backfill GEO

# GEO の集計テーブル(GeoDecision)を、これまでの全ハンドから作り直す手動ワークフロー。
# 集計の対象を変えたとき(2026-10-23 に自動の席の決定も含めるようにした等)に1回だけ流す。
# 全ハンドを読み直すので Supabase の転送量を使う。むやみに何度も流さない。

on:
  workflow_dispatch:
    inputs:
      skip:
        description: "先頭から飛ばすハンド数(時間切れで止まったときの続き)"
        default: "0"
  push:
    branches: [main]
    paths: [".github/workflows/backfill-geo.yml"]

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meta-geo/db run generate
      - name: Rebuild GeoDecision for all hands
        # 接続の枠(Supabase のセッション方式は同時15本まで)は本番のサーバーと分け合う。
        # ここで使うのは3本までにして、サーバーの接続を奪わない。
        run: |
          case "$DATABASE_URL" in *\?*) sep="&";; *) sep="?";; esac
          export DATABASE_URL="${DATABASE_URL}${sep}connection_limit=3"
          pnpm --filter @meta-geo/db exec tsx scripts/backfillGeoDecisions.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # 1回目(2026-10-23)は5時間で 12,800 / 43,493 ハンドまで進んで時間切れ。続きから3並びで流す。
          SKIP: ${{ inputs.skip || '12800' }}
          CONCURRENCY: "3"
